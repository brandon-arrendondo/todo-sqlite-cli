[project]
name = "todo-sqlite-cli-mcp"
version = "0.1.0"
description = "MCP server wrapping todo-sqlite-cli"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer and changed the import path this
    # server relies on (mcp.server.fastmcp); pin to the v1 API until server.py
    # is migrated.
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
todo-mcp-server = "server:main"

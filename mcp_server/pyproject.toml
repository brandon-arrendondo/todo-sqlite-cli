[project]
name = "todo-sqlite-cli-mcp"
version = "4.4.0"
description = "MCP server wrapping todo-sqlite-cli"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
todo-mcp-server = "server:main"

[tool.setuptools]
py-modules = ["server", "cli_ops", "mqtt_service"]
